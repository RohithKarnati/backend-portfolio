<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Developer Mode | Rohith Kumar</title>
    <meta name="description" content="A Linux-inspired virtual terminal exploring Rohith Kumar's backend engineering portfolio.">

    <link rel="stylesheet" th:href="@{/developer.css}">
</head>

<body class="terminal-bg">

<div class="terminal-shell">
    <div class="terminal-titlebar">
        <div class="titlebar-dots" aria-hidden="true">
            <span></span><span></span><span></span>
        </div>
        <div class="titlebar-label">rohith@portfolio</div>
        <div class="titlebar-badge">DEV</div>
    </div>

    <div id="terminalOutput" class="terminal-output" role="log" aria-live="polite"></div>

    <div class="terminal-input-row">
        <span id="prompt" class="terminal-prompt">rohith@portfolio:~$</span>
        <input id="terminalInput" class="terminal-input" type="text" autocomplete="off"
               autocapitalize="off" spellcheck="false" aria-label="Terminal input" autofocus>
    </div>
</div>

<a class="back-to-dashboard" th:href="@{/}">&larr; Back to dashboard</a>

<script th:src="@{/js/developer.js}"></script>

</body>
</html>
