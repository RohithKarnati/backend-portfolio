<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>

<!--/* Shared browser-tab icons, included in the <head> of every page. */-->
<th:block th:fragment="favicon">
    <link rel="icon" type="image/svg+xml" th:href="@{/images/favicon.svg}">
    <link rel="icon" type="image/png" sizes="192x192" th:href="@{/images/favicon.png}">
    <link rel="apple-touch-icon" th:href="@{/images/favicon.png}">
    <meta name="theme-color" content="#08090c">
</th:block>

</head>
</html>
